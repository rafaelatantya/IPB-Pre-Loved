services:
  web:
    build: .
    container_name: ipb-preloved-web
    ports:
      - "8788:8788"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    # Wrangler akan baca .dev.vars otomatis di dalam container
    environment:
      - NODE_ENV=development
      - AUTH_TRUST_HOST=true
      # - DB_RESET=true  # Hapus tanda '#' di awal untuk paksa RESET database saat startup
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Alokasi resource biar ga OOM saat build Next.js
    mem_limit: 4g
    mem_reservation: 2g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s # Ditingkatkan karena build lumayan lama
